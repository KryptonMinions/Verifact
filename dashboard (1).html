<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misinformation Analytics Dashboard</title>
    
    <!-- 1. Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. ApexCharts for the Graph -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- Custom Styles for the Neon Glow effects -->
    <style>
        body {
            background-color: #0f111a; /* Deep dark background */
            font-family: 'Inter', sans-serif;
        }
        .neon-card {
            background: #1a1d2d;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        .neon-card:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); 
            border-color: rgba(59, 130, 246, 0.3);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-300 p-6 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-7xl space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-end border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Topic Trends</h1>
                <p class="text-gray-500 text-sm mt-1">Real-time frequency of reported misinformation topics</p>
            </div>
            <div class="text-xs text-gray-600 flex items-center gap-2">
                <span id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </div>

        <!-- Metric Cards Row -->
        <!-- Updated grid to support 4 columns on large screens -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <!-- Card 1: Total Reports -->
            <div class="neon-card rounded-xl p-6 border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"></path><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"></path></svg>
                </div>
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider">Total Reports</h3>
                <div class="flex items-baseline mt-2">
                    <span id="total-reports" class="text-4xl font-bold text-white">--</span>
                    <span class="ml-2 text-sm text-green-400 flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-1 animate-pulse"></span> Live
                    </span>
                </div>
            </div>

            <!-- Card 2: Top Category -->
            <div class="neon-card rounded-xl p-6 border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-pink-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </div>
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider">Top Category</h3>
                <div class="mt-2">
                    <span id="top-category" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">
                        --
                    </span>
                </div>
            </div>

            <!-- Card 3: Top Source (NEW) -->
            <div class="neon-card rounded-xl p-6 border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <svg class="w-16 h-16 text-purple-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.974 6 7.5 6A1.5 1.5 0 019 7.5V8a2 2 0 004 0 2 2 0 011.523-1.943A5.977 5.977 0 0116 10c0 .34-.028.675-.083 1H15a2 2 0 00-2 2v2.197A5.973 5.973 0 0110 16v-2a2 2 0 00-2-2 2 2 0 01-2-2 2 2 0 00-1.668-1.973z" clip-rule="evenodd"></path></svg>
                </div>
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider">Top Source (24h)</h3>
                <div class="mt-2">
                    <span id="top-source" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">
                        --
                    </span>
                </div>
            </div>

            <!-- Card 4: System Status -->
            <div class="neon-card rounded-xl p-6 border border-gray-800 flex flex-col justify-center">
                 <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Last Sync</h3>
                 <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
                    <span id="last-updated-text" class="text-sm font-medium text-gray-400">Waiting for update...</span>
                 </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="neon-card rounded-xl border border-gray-800 p-6">
            <div id="chart"></div>
        </div>

    </div>

    <!-- 3. Firebase & Dashboard Logic -->
    <script type="module">
        // Import the functions you need from the SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ------------------------------------------------------------------
        // CONFIGURATION (Fixed with valid credentials)
        // ------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDrsPtoPLHmRDfPQZ3xlmrwBFzXP9DXr5M",
            authDomain: "agent-builder-472216.firebaseapp.com",
            projectId: "agent-builder-472216",
            storageBucket: "agent-builder-472216.firebasestorage.app",
            messagingSenderId: "737726244243",
            appId: "1:737726244243:web:61570da297404124113466",
            measurementId: "G-8HHL64ZF8H"
        };

        // ------------------------------------------------------------------
        // INITIALIZATION
        // ------------------------------------------------------------------
        let db;
        let auth;

        try {
            const app = initializeApp(firebaseConfig);
            // CRITICAL: Connecting to the named database "misinfo-reports"
            db = getFirestore(app, "misinfo-reports");
            auth = getAuth(app);
            updateStatus("authenticating");
        } catch (e) {
            console.error("Firebase Init Error:", e);
            updateStatus("error");
        }

        // ------------------------------------------------------------------
        // AUTHENTICATION LOGIC (Rule 3: Auth First with Fallback)
        // ------------------------------------------------------------------
        const initAuth = async () => {
            try {
                // Attempt 1: Try using the environment token (if it exists)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    console.log("Attempting auth with custom token...");
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // If no token exists, go straight to anonymous
                    console.log("No custom token found, using anonymous auth.");
                    await signInAnonymously(auth);
                }
            } catch (error) {
                // Attempt 2: FALLBACK
                // If custom token fails (likely due to project ID mismatch between env and your config),
                // fall back to anonymous authentication.
                console.warn("Custom token auth failed (likely mismatch). Falling back to Anonymous Auth.", error);
                try {
                    await signInAnonymously(auth);
                } catch (anonError) {
                    console.error("Anonymous Auth also failed:", anonError);
                    updateStatus("error");
                }
            }
        };

        // ------------------------------------------------------------------
        // CHART SETUP (ApexCharts)
        // ------------------------------------------------------------------
        let chart;
        const chartOptions = {
            series: [],
            chart: {
                type: 'area',
                height: 350,
                background: 'transparent',
                toolbar: { show: false },
                animations: { enabled: true, easing: 'easeinout', speed: 800 }
            },
            colors: ['#00E396', '#775DD0', '#FEB019', '#FF4560', '#008FFB'], // Neon Palette
            dataLabels: { enabled: false },
            stroke: { curve: 'smooth', width: 3 },
            fill: {
                type: 'gradient',
                gradient: {
                    shadeIntensity: 1,
                    opacityFrom: 0.7,
                    opacityTo: 0.1,
                    stops: [0, 90, 100]
                }
            },
            xaxis: {
                categories: [],
                axisBorder: { show: false },
                axisTicks: { show: false },
                labels: { style: { colors: '#6b7280' } }
            },
            yaxis: {
                labels: { style: { colors: '#6b7280' } }
            },
            grid: {
                borderColor: '#374151',
                strokeDashArray: 4,
                yaxis: { lines: { show: true } } 
            },
            theme: { mode: 'dark' },
            legend: {
                position: 'top',
                horizontalAlign: 'right',
                labels: { colors: '#9ca3af' }
            }
        };

        // Render the empty chart immediately
        if (document.querySelector("#chart")) {
            chart = new ApexCharts(document.querySelector("#chart"), chartOptions);
            chart.render();
        }

        // ------------------------------------------------------------------
        // MAIN LOGIC LOOP
        // ------------------------------------------------------------------
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("User authenticated:", user.uid);
                    updateStatus("online");
                    startDataListener();
                } else {
                    // If auth drops, try to reconnect
                    // Only trigger this if not already attempting to auth
                    // to avoid loops, but for this simple dashboard it's okay.
                }
            });
        }

        function startDataListener() {
            // Connect to the specific document created by your Cloud Function
            // Note: This path 'app_metadata/dashboard_stats' was defined in your Python Cloud Function
            const docRef = doc(db, "app_metadata", "dashboard_stats");

            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log("Received Stats:", data);
                    updateDashboard(data);
                } else {
                    console.log("Waiting for Cloud Function to generate 'app_metadata/dashboard_stats'...");
                    document.getElementById('last-updated-text').innerText = "No Data Yet";
                }
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                updateStatus("error");
                if(error.code === 'permission-denied') {
                   console.error("PERMISSION DENIED: Check Firestore Rules for 'app_metadata/dashboard_stats'");
                }
            });
        }

        // Function to update the UI elements
        function updateDashboard(data) {
            // 1. Update Texts
            const total = data.total_reports || 0;
            document.getElementById('total-reports').innerText = total.toLocaleString();
            document.getElementById('top-category').innerText = data.top_category || "N/A";
            
            // --- NEW: Update Top Source ---
            document.getElementById('top-source').innerText = data.top_source || "N/A";
            
            if (data.last_updated) {
                const date = new Date(data.last_updated);
                document.getElementById('last-updated-text').innerText = `${date.toLocaleTimeString()}`;
            }

            // 2. Update Chart
            if (data.chart_data && data.chart_data.labels && data.chart_data.series) {
                chart.updateOptions({
                    xaxis: {
                        categories: data.chart_data.labels
                    }
                });
                chart.updateSeries(data.chart_data.series);
            }
        }

        // Helper for status indicator
        function updateStatus(status) {
            const indicator = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            if (status === "online") {
                indicator.classList.remove('bg-red-500', 'bg-blue-500');
                indicator.classList.add('bg-green-500', 'animate-pulse');
                text.innerText = "Live";
                text.classList.add('text-green-400');
            } else if (status === "authenticating") {
                indicator.classList.remove('bg-red-500', 'bg-green-500');
                indicator.classList.add('bg-blue-500');
                text.innerText = "Auth...";
            } else {
                indicator.classList.remove('bg-green-500', 'bg-blue-500');
                indicator.classList.add('bg-red-500');
                text.innerText = "Error";
                text.classList.remove('text-green-400');
                text.classList.add('text-red-400');
            }
        }

        // Kickstart the process
        if (auth) {
            initAuth();
        }

    </script>
</body>
</html>
