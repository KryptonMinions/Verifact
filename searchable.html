<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misinfo Reports Database</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            background-color: #0f111a;
            font-family: 'Inter', sans-serif;
        }
        .neon-border {
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); 
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }
        .neon-border:focus-within {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); 
            border-color: rgba(59, 130, 246, 0.6);
        }
        .report-card {
            background: #1a1d2d;
            border: 1px solid #2d3748;
        }
        .claim-card {
            background: #23273a;
            border: 1px solid #374151;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f111a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-7xl space-y-8">
        
        <div class="space-y-4">
            <div class="flex justify-between items-end border-b border-gray-800 pb-4">
                <div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">VeriFact Report Database</h1>
                    <p class="text-gray-500 text-sm mt-1">Search recent analyzed claims, fact-checks, and evidence</p>
                </div>
                <div class="text-xs text-gray-600 flex items-center gap-2">
                    <span id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>

            <div class="neon-border rounded-lg bg-[#1a1d2d] flex items-center p-3">
                <svg class="w-6 h-6 text-gray-500 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" placeholder="Search claims, fact checks, or keywords..." 
                       class="w-full bg-transparent border-none text-white focus:ring-0 ml-3 placeholder-gray-600 text-lg">
            </div>
            
            <div class="flex justify-between text-sm text-gray-500">
                <span id="result-count">0 reports found</span>
                <span>Live Data from Firestore</span>
            </div>
        </div>

        <div id="reports-grid" class="flex flex-col gap-8">
            <div class="text-center py-20 text-gray-600 animate-pulse">
                Loading reports...
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ------------------------------------------------------------------
        // CONFIGURATION
        // ------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDrsPtoPLHmRDfPQZ3xlmrwBFzXP9DXr5M",
            authDomain: "agent-builder-472216.firebaseapp.com",
            projectId: "agent-builder-472216",
            storageBucket: "agent-builder-472216.firebasestorage.app",
            messagingSenderId: "737726244243",
            appId: "1:737726244243:web:61570da297404124113466",
            measurementId: "G-8HHL64ZF8H"
        };

        let db, auth;
        let allReports = []; 

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app, "misinfo-reports");
            auth = getAuth(app);
            updateStatus("authenticating");
        } catch (e) {
            console.error("Firebase Init Error:", e);
            updateStatus("error");
        }

        // ------------------------------------------------------------------
        // AUTH
        // ------------------------------------------------------------------
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.warn("Auth fallback...", error);
                await signInAnonymously(auth);
            }
        };

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    updateStatus("online");
                    listenToReports();
                }
            });
            initAuth();
        }

        // ------------------------------------------------------------------
        // DATA FETCHING
        // ------------------------------------------------------------------
        function listenToReports() {
            const q = query(collection(db, "misinfo_reports"), limit(200)); 

            onSnapshot(q, (snapshot) => {
                allReports = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.analyzed_claims && Array.isArray(data.analyzed_claims)) {
                        allReports.push({
                            id: doc.id,
                            timestamp: data.timestamp || null, 
                            claims: data.analyzed_claims
                        });
                    }
                });
                renderReports(allReports);
            }, (error) => {
                console.error("Error getting reports:", error);
                updateStatus("error");
            });
        }

        // ------------------------------------------------------------------
        // SEARCH LOGIC
        // ------------------------------------------------------------------
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            
            if (!term) {
                renderReports(allReports);
                return;
            }

            const filtered = allReports.filter(report => {
                return report.claims.some(claim => 
                    (claim.claim_text && claim.claim_text.toLowerCase().includes(term)) ||
                    (claim.conclusion && claim.conclusion.toLowerCase().includes(term))
                );
            });

            renderReports(filtered);
        });

        // ------------------------------------------------------------------
        // RENDERING
        // ------------------------------------------------------------------
        function renderReports(reportsData) {
            const container = document.getElementById('reports-grid');
            const countLabel = document.getElementById('result-count');
            
            countLabel.innerText = `${reportsData.length} reports found`;
            container.innerHTML = '';

            if (reportsData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-600">No reports match your search.</div>`;
                return;
            }

            reportsData.forEach(report => {
                const reportCard = document.createElement('div');
                // Added x-data to the report card itself to manage the "Show All" state
                reportCard.className = "report-card rounded-xl p-6 relative overflow-hidden transition-all duration-300";
                reportCard.setAttribute('x-data', '{ expandedReport: false }');

                // Split claims: First one vs. the Rest
                const firstClaim = report.claims[0];
                const remainingClaims = report.claims.slice(1);

                // Render HTML strings
                const firstClaimHtml = renderClaimHtml(firstClaim, 0);
                const remainingClaimsHtml = remainingClaims.map((claim, index) => renderClaimHtml(claim, index + 1)).join('');

                // Only show the "Show More" button if there are actually more claims
                const showMoreBtnHtml = remainingClaims.length > 0 ? `
                    <div class="mt-4 flex justify-center border-t border-gray-700/50 pt-4">
                        <button @click="expandedReport = !expandedReport" 
                                class="flex items-center gap-2 text-sm font-semibold text-blue-400 hover:text-blue-300 transition-colors px-4 py-2 rounded-lg hover:bg-white/5">
                            <span x-text="expandedReport ? 'Show Less' : 'View ${remainingClaims.length} More Claims'"></span>
                            <svg class="w-4 h-4 transform transition-transform duration-300" :class="expandedReport ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>
                ` : '';

                reportCard.innerHTML = `
                    <div class="border-b border-gray-700 pb-4 mb-6 flex justify-between items-center">
                        <div>
                            <span class="bg-gray-800 text-gray-300 text-xs px-2 py-1 rounded border border-gray-700 font-mono">ID: ${report.id.substring(0,8)}</span>
                            ${report.timestamp ? `<span class="ml-2 text-xs text-gray-500">${new Date(report.timestamp).toLocaleDateString()}</span>` : ''}
                        </div>
                        <span class="text-xs text-gray-500 font-semibold uppercase tracking-wider">${report.claims.length} Claims Total</span>
                    </div>

                    <div class="space-y-6">
                        <div>
                            ${firstClaimHtml}
                        </div>

                        <div x-show="expandedReport" x-collapse class="space-y-6">
                            ${remainingClaimsHtml}
                        </div>
                    </div>

                    ${showMoreBtnHtml}
                `;
                container.appendChild(reportCard);
            });
        }

        function renderClaimHtml(claim, index) {
            // Evidence Lists
            const factCheckHtml = generateEvidenceList(claim.fact_checking_results, 'text-purple-400', 'Fact Check Results', 'inference', 'url');
            const supportingHtml = generateEvidenceList(claim.supporting_evidence, 'text-green-400', 'Supporting Evidence', 'summary', 'source');
            const opposingHtml = generateEvidenceList(claim.opposing_evidence, 'text-red-400', 'Opposing Evidence', 'summary', 'source');

            // Status Colors
            let statusColor = "text-blue-400"; 
            let borderColor = "border-blue-500/30";
            const conc = claim.conclusion ? claim.conclusion.toLowerCase() : "";

            if (conc.includes("supported") || conc.includes("accurate") || conc.includes("true")) {
                statusColor = "text-green-400";
                borderColor = "border-green-500/30";
            } else if (conc.includes("false") || conc.includes("incorrect") || conc.includes("debunked")) {
                statusColor = "text-red-400";
                borderColor = "border-red-500/30";
            } else if (conc.includes("unverified") || conc.includes("misleading") || conc.includes("context")) {
                statusColor = "text-yellow-400";
                borderColor = "border-yellow-500/30";
            }

            // Claim Card HTML
            return `
                <div class="claim-card rounded-lg p-5 border-l-4 ${borderColor}" x-data="{ expanded: false }">
                    <div class="flex flex-col gap-3">
                        <div>
                            <h3 class="text-lg font-bold text-white leading-snug">"${claim.claim_text || 'No claim text'}"</h3>
                        </div>
                        
                        <div class="bg-[#151824] rounded p-3">
                            <p class="text-sm text-gray-300">
                                <span class="font-bold ${statusColor} uppercase text-xs tracking-wide mr-2">Conclusion</span> 
                                ${claim.conclusion || 'No conclusion provided.'}
                            </p>
                        </div>

                        <div class="flex justify-start mt-2">
                            <button @click="expanded = !expanded" 
                                    class="flex items-center text-xs font-bold text-gray-500 hover:text-white transition-colors focus:outline-none">
                                <span x-text="expanded ? 'HIDE DETAILS' : 'VIEW ANALYSIS & SOURCES'"></span>
                                <svg class="w-4 h-4 ml-1 transform transition-transform" :class="expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>

                        <div x-show="expanded" x-collapse class="mt-2 pt-4 border-t border-gray-700 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>${factCheckHtml}</div>
                            <div>${supportingHtml}</div>
                            <div>${opposingHtml}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateEvidenceList(evidenceArray, colorClass, title, textKey, linkKey) {
            if (!evidenceArray || !Array.isArray(evidenceArray) || evidenceArray.length === 0) {
                return `
                    <h4 class="text-xs font-bold ${colorClass} mb-2 opacity-50 uppercase">${title}</h4>
                    <p class="text-[10px] text-gray-600 italic border border-dashed border-gray-800 p-2 rounded">No data found.</p>
                `;
            }

            let items = evidenceArray.map(item => {
                const textContent = item[textKey] || 'No description available.';
                const linkUrl = item[linkKey];

                return `
                <div class="mb-3 pb-3 border-b border-gray-800 last:border-0 last:pb-0 last:mb-0">
                    <p class="text-xs text-gray-300 mb-1 leading-relaxed">${textContent}</p>
                    ${linkUrl ? `
                    <a href="${linkUrl}" target="_blank" class="text-[10px] text-blue-500 hover:text-blue-300 flex items-center gap-1 truncate max-w-full mt-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        Source Link
                    </a>` : ''}
                </div>
            `}).join('');

            return `
                <h4 class="text-xs font-bold ${colorClass} mb-2 uppercase border-b border-gray-700 pb-1">${title} (${evidenceArray.length})</h4>
                <div class="bg-[#1a1d2d] p-3 rounded border border-gray-800 max-h-60 overflow-y-auto custom-scrollbar">
                    ${items}
                </div>
            `;
        }

        function updateStatus(status) {
            const indicator = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (status === "online") {
                indicator.classList.replace('bg-red-500', 'bg-green-500');
                indicator.classList.replace('bg-blue-500', 'bg-green-500');
                indicator.classList.add('animate-pulse');
                text.innerText = "Live";
                text.classList.add('text-green-400');
            } else if (status === "authenticating") {
                indicator.classList.replace('bg-red-500', 'bg-blue-500');
                text.innerText = "Auth...";
            } else {
                indicator.classList.replace('bg-green-500', 'bg-red-500');
                indicator.classList.replace('bg-blue-500', 'bg-red-500');
                text.innerText = "Error";
                text.classList.remove('text-green-400');
                text.classList.add('text-red-400');
            }
        }
    </script>
</body>
</html>
